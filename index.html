<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Peak Row Extractor & Scatter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Client-side libs from CDN (no server needed) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 1rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .panel { border: 1px solid #e5e7eb; padding: 1rem; border-radius: 8px; margin: 0.75rem 0; }
    label { font-weight: 600; }
    input[type="number"] { width: 8rem; }
    select { max-width: 20rem; }
    #qcPlot, #scatterPlot { width: 100%; height: 520px; }
    .hint { color: #555; font-size: 0.9rem; }
    .spacer { flex: 1 1 auto; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Peak Row Extractor & Scatter</h1>

  <!-- Load CSV -->
  <div class="panel">
    <div class="row">
      <label for="file">Load CSV:</label>
      <input id="file" type="file" accept=".csv,text/csv" />
      <span id="status"></span>
      <div class="spacer"></div>
      <span class="hint">All processing happens in your browser. No data leaves your device.</span>
    </div>
  </div>

  <!-- Peak detection controls -->
  <div class="panel">
    <div class="row">
      <label for="peakSourceCol">Peak source column:</label>
      <select id="peakSourceCol"></select>

      <label for="prom">Prominence:</label>
      <input id="prom" type="number" step="any" value="280" />
      <button id="autoProm">Auto</button>

      <label for="distRows">Min distance (rows):</label>
      <input id="distRows" type="number" step="1" value="25" />

      <label for="smoothWin">Smooth (window, odd; 0=off):</label>
      <input id="smoothWin" type="number" step="1" value="9" />
    </div>

    <div class="row">
      <label for="xSepCol">X column for separation (optional):</label>
      <select id="xSepCol"></select>

      <label for="xMinSep">Min separation (X units):</label>
      <input id="xMinSep" type="number" step="any" value="1" />
      <span class="hint">(If set, peaks must be ≥ this far apart along the chosen X column.)</span>

      <button id="run">Detect Peaks</button>
      <span id="info"></span>
    </div>
  </div>

  <!-- QC plot (full signal + detected peaks) -->
  <div class="panel">
    <h3>QC view: Signal with detected peaks</h3>
    <div class="row">
      <label for="qcXCol">QC X axis:</label>
      <select id="qcXCol"></select>
      <span class="hint">Pick your “time”/index column for the QC plot. If none, leave as Index.</span>
    </div>
    <div id="qcPlot"></div>
  </div>

  <!-- Scatter plot of peak rows -->
  <div class="panel">
    <div class="row">
      <label for="xCol">Scatter X axis:</label>
      <select id="xCol"></select>

      <label for="yCol">Scatter Y axis:</label>
      <select id="yCol"></select>

      <button id="plotBtn">Plot Scatter of Peak Rows</button>
      <span id="scatterInfo"></span>
    </div>
    <div id="scatterPlot"></div>
  </div>

  <!-- Export -->
  <div class="panel">
    <button id="downloadPeaks">Download peak rows (CSV)</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
